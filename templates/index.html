<!DOCTYPE html>
<html>
<head>
    <title>Two-Tier Flask App</title>
</head>
<body>
    <h1>Messages</h1>
    <form action="/add" method="post">
        <input type="text" name="message" placeholder="Enter a message"/>
        <button type="submit">Add</button>
    </form>
    <ul>
        {% for message in messages %}
            <li>{{ message[1] }}</li>
        {% endfor %}
    </ul>
</body>
</html>
